<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undertone — read the feeling in a sentence</title>
<meta name="description" content="Paste any sentence and see the emotion moving underneath it.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,640&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #1b1523;
    --bg-2: #221a2c;
    --panel: #251d31;
    --line: rgba(243,238,231,0.14);
    --line-soft: rgba(243,238,231,0.07);
    --ink: #f3eee7;
    --ink-dim: #b6adc4;
    --ink-faint: #7d7590;

    --c-sadness: #5b7fde;
    --c-joy: #f2b705;
    --c-love: #e85d75;
    --c-anger: #e4572e;
    --c-fear: #8a5fb0;
    --c-surprise: #38b2ac;

    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: radial-gradient(120% 140% at 50% -10%, var(--bg-2) 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 0 20px 80px;
  }

  a{ color: inherit; }

  :focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    width:100%;
    max-width: 760px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 28px 4px 0;
  }

  .wordmark{
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-weight: 560;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }

  .health{
    display:flex;
    align-items:center;
    gap:8px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-faint);
  }

  .health-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--ink-faint);
    transition: background 0.4s ease;
  }
  .health-dot.ok{ background: #6fcf97; }
  .health-dot.down{ background: #e4572e; }

  /* ---------- hero ---------- */
  .hero{
    max-width: 620px;
    width:100%;
    text-align:center;
    margin-top: 64px;
  }

  .hero h1{
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-weight: 560;
    font-size: clamp(1.9rem, 5vw, 2.7rem);
    line-height: 1.18;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .hero p{
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 46ch;
    margin: 0 auto;
  }

  /* ---------- input panel ---------- */
  .panel{
    width:100%;
    max-width: 620px;
    margin-top: 44px;
  }

  .field-label{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip: rect(0 0 0 0);
    white-space:nowrap;
  }

  .input-shell{
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    transition: border-color 0.25s ease;
  }
  .input-shell:focus-within{
    border-color: var(--ink);
  }

  textarea{
    width:100%;
    resize:none;
    background:none;
    border:none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.15rem;
    line-height: 1.55;
    min-height: 2.6em;
    padding: 4px 2px;
  }
  textarea::placeholder{ color: var(--ink-faint); }
  textarea:focus{ outline:none; }

  .panel-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: 16px;
    gap: 12px;
  }

  .char-count{
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  button.analyze{
    font-family: var(--sans);
    font-weight: 500;
    font-size: 0.94rem;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink-dim);
    border-radius: 999px;
    padding: 11px 24px;
    cursor:pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  button.analyze:hover:not(:disabled){
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  button.analyze:disabled{
    opacity: 0.5;
    cursor: default;
  }

  .error-msg{
    margin-top: 14px;
    font-size: 0.9rem;
    color: #f0a08a;
    line-height: 1.5;
    display:none;
  }
  .error-msg.show{ display:block; }

  /* ---------- results ---------- */
  .results{
    width:100%;
    max-width: 620px;
    margin-top: 56px;
    padding-top: 44px;
    border-top: 1px solid var(--line-soft);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .results.visible{
    opacity: 1;
    transform: none;
  }

  .results-grid{
    display:grid;
    grid-template-columns: 168px 1fr;
    gap: 36px;
    align-items:center;
  }

  @media (max-width: 560px){
    .results-grid{
      grid-template-columns: 1fr;
      justify-items:center;
      text-align:center;
    }
  }

  /* dial */
  .dial-wrap{
    position:relative;
    width:168px;
    height:168px;
    justify-self:center;
  }

  .dial{
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }

  .dial circle{
    fill:none;
    stroke-width: 15;
  }

  .dial .track{
    stroke: var(--line-soft);
  }

  .dial .seg{
    stroke-dasharray: 0 1000;
    stroke-dashoffset: 0;
    stroke-linecap: butt;
    transition: stroke-dasharray 0.9s cubic-bezier(.4,0,.2,1), stroke-dashoffset 0.9s cubic-bezier(.4,0,.2,1);
  }

  .dial-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }

  .dial-emoji{
    font-size: 1.9rem;
    line-height:1;
    margin-bottom: 6px;
  }

  .dial-name{
    font-family: var(--serif);
    font-weight: 560;
    font-size: 1.05rem;
  }

  .dial-pct{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin-top: 3px;
  }

  /* breakdown list */
  .breakdown{
    display:flex;
    flex-direction:column;
    gap: 13px;
    width:100%;
  }

  .row{
    display:grid;
    grid-template-columns: 92px 1fr 44px;
    align-items:center;
    gap: 12px;
  }

  .row-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 0.88rem;
    color: var(--ink-dim);
  }

  .row-dot{
    width:8px; height:8px;
    border-radius:50%;
    flex-shrink:0;
  }

  .row-track{
    height: 5px;
    border-radius: 3px;
    background: var(--line-soft);
    overflow:hidden;
  }

  .row-fill{
    height:100%;
    width:0%;
    border-radius: 3px;
    transition: width 0.9s cubic-bezier(.4,0,.2,1);
  }

  .row-pct{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-faint);
    text-align:right;
  }

  .analyzed-line{
    margin-top: 32px;
    font-size: 0.88rem;
    color: var(--ink-faint);
    font-style: italic;
    line-height:1.5;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="wordmark">Undertone</div>
    <div class="health">
      <span class="health-dot" id="health-dot"></span>
      <span id="health-text">checking model…</span>
    </div>
  </div>

  <main class="hero">
    <h1>What's underneath the words?</h1>
    <p>Paste a sentence, a caption, a text you're overthinking — the model reads the feeling moving underneath it.</p>
  </main>

  <section class="panel">
    <label class="field-label" for="text-input">Text to analyse</label>
    <div class="input-shell">
      <textarea
        id="text-input"
        maxlength="2000"
        rows="2"
        placeholder="Type or paste something here…"
      ></textarea>
    </div>
    <div class="panel-footer">
      <span class="char-count" id="char-count">0 / 2000</span>
      <button class="analyze" id="analyze-btn" type="button">Read the feeling</button>
    </div>
    <p class="error-msg" id="error-msg"></p>
  </section>

  <section class="results" id="results" aria-live="polite">
    <div class="results-grid">
      <div class="dial-wrap">
        <svg class="dial" viewBox="0 0 160 160" aria-hidden="true">
          <circle class="track" cx="80" cy="80" r="70"></circle>
          <circle class="seg" id="seg-sadness"  cx="80" cy="80" r="70" stroke="#5b7fde"></circle>
          <circle class="seg" id="seg-joy"      cx="80" cy="80" r="70" stroke="#f2b705"></circle>
          <circle class="seg" id="seg-love"     cx="80" cy="80" r="70" stroke="#e85d75"></circle>
          <circle class="seg" id="seg-anger"    cx="80" cy="80" r="70" stroke="#e4572e"></circle>
          <circle class="seg" id="seg-fear"     cx="80" cy="80" r="70" stroke="#8a5fb0"></circle>
          <circle class="seg" id="seg-surprise" cx="80" cy="80" r="70" stroke="#38b2ac"></circle>
        </svg>
        <div class="dial-center">
          <div class="dial-emoji" id="dial-emoji">—</div>
          <div class="dial-name" id="dial-name">No reading yet</div>
          <div class="dial-pct" id="dial-pct"></div>
        </div>
      </div>

      <div class="breakdown" id="breakdown"></div>
    </div>

    <p class="analyzed-line" id="analyzed-line"></p>
  </section>

<script>
(function(){
  // Same-origin backend by default (FastAPI serves this file and the API
  // from the same app). Change this if the frontend is hosted separately
  // from the API, e.g. API_BASE = "https://your-api.onrender.com"
  const API_BASE = "http://127.0.0.1:8000";

  const EMOTIONS = [
    { key: "sadness",  label: "Sadness",  emoji: "😢", color: "#5b7fde" },
    { key: "joy",      label: "Joy",      emoji: "🤗", color: "#f2b705" },
    { key: "love",     label: "Love",     emoji: "❤️", color: "#e85d75" },
    { key: "anger",    label: "Anger",    emoji: "😡", color: "#e4572e" },
    { key: "fear",     label: "Fear",     emoji: "😰", color: "#8a5fb0" },
    { key: "surprise", label: "Surprise", emoji: "😲", color: "#38b2ac" }
  ];

  const els = {
    textarea: document.getElementById("text-input"),
    charCount: document.getElementById("char-count"),
    button: document.getElementById("analyze-btn"),
    error: document.getElementById("error-msg"),
    results: document.getElementById("results"),
    dialEmoji: document.getElementById("dial-emoji"),
    dialName: document.getElementById("dial-name"),
    dialPct: document.getElementById("dial-pct"),
    breakdown: document.getElementById("breakdown"),
    analyzedLine: document.getElementById("analyzed-line"),
    healthDot: document.getElementById("health-dot"),
    healthText: document.getElementById("health-text")
  };

  const CIRCUMFERENCE = 2 * Math.PI * 70;

  // Build the breakdown rows once
  EMOTIONS.forEach(e => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span class="row-label"><span class="row-dot" style="background:${e.color}"></span>${e.label}</span>
      <span class="row-track"><span class="row-fill" id="fill-${e.key}" style="background:${e.color}"></span></span>
      <span class="row-pct" id="pct-${e.key}">0%</span>
    `;
    els.breakdown.appendChild(row);
  });

  // Auto-grow the textarea
  els.textarea.addEventListener("input", () => {
    els.charCount.textContent = `${els.textarea.value.length} / 2000`;
    els.textarea.style.height = "auto";
    els.textarea.style.height = els.textarea.scrollHeight + "px";
  });

  els.textarea.addEventListener("keydown", (evt) => {
    if (evt.key === "Enter" && (evt.metaKey || evt.ctrlKey)) {
      evt.preventDefault();
      analyze();
    }
  });

  els.button.addEventListener("click", analyze);

  function setError(message){
    if (!message){
      els.error.classList.remove("show");
      els.error.textContent = "";
      return;
    }
    els.error.textContent = message;
    els.error.classList.add("show");
  }

  function setLoading(isLoading){
    els.button.disabled = isLoading;
    els.button.textContent = isLoading ? "Reading…" : "Read the feeling";
  }

  async function analyze(){
    const text = els.textarea.value.trim();
    setError(null);

    if (!text){
      setError("Type something first — there's nothing to read yet.");
      els.textarea.focus();
      return;
    }

    setLoading(true);

    try{
      const res = await fetch(`${API_BASE}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      if (!res.ok){
        let detail = "The model couldn't read that. Try again in a moment.";
        try{
          const body = await res.json();
          if (body && body.detail) detail = body.detail;
        }catch(_){}
        throw new Error(detail);
      }

      const data = await res.json();
      renderResults(data);
    }catch(err){
      setError(err.message === "Failed to fetch"
        ? "Couldn't reach the server. Check that the backend is running and try again."
        : err.message);
    }finally{
      setLoading(false);
    }
  }

  function renderResults(data){
    const probs = data.all_probabilities || {};
    const top = EMOTIONS.find(e => e.key === data.predicted_emotion) || EMOTIONS[0];

    // Dial segments, drawn in a fixed order so the ring reads consistently
    let cumulative = 0;
    EMOTIONS.forEach(e => {
      const value = probs[e.key] || 0;
      const segLen = value * CIRCUMFERENCE;
      const circle = document.getElementById(`seg-${e.key}`);
      circle.setAttribute("stroke-dasharray", `${segLen} ${CIRCUMFERENCE - segLen}`);
      circle.setAttribute("stroke-dashoffset", `${-cumulative}`);
      cumulative += segLen;

      document.getElementById(`fill-${e.key}`).style.width = `${(value * 100).toFixed(1)}%`;
      document.getElementById(`pct-${e.key}`).textContent = `${Math.round(value * 100)}%`;
    });

    els.dialEmoji.textContent = top.emoji;
    els.dialName.textContent = top.label;
    els.dialPct.textContent = `${Math.round(data.confidence * 100)}% sure`;

    els.analyzedLine.textContent = `From: "${data.text}"`;

    els.results.classList.add("visible");
  }

  // Health check
  async function checkHealth(){
    try{
      const res = await fetch(`${API_BASE}/health`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (data.model_loaded){
        els.healthDot.classList.add("ok");
        els.healthText.textContent = "model ready";
      }else{
        els.healthText.textContent = "waking up the model…";
        setTimeout(checkHealth, 3000);
      }
    }catch(_){
      els.healthDot.classList.add("down");
      els.healthText.textContent = "server offline";
    }
  }

  checkHealth();
})();
</script>

</body>
</html>
